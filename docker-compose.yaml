# Development Docker Compose stack

x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
        target: development
    env_file:
        - .env
    environment: &app-environment
        APP_ENV: local
        APP_DEBUG: "true"
        APP_URL: http://localhost:${APP_PORT:-8000}
        DB_HOST: db
        REDIS_HOST: redis
        MAIL_MAILER: smtp
        MAIL_SCHEME: ""
        MAIL_HOST: mailpit
        MAIL_PORT: 1025
        MAIL_USERNAME: ""
        MAIL_PASSWORD: ""
        SESSION_SECURE_COOKIE: "false"
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    volumes: &app-volumes
        - .:/var/www
        - vendor_data:/var/www/vendor
        - node_modules:/var/www/node_modules
        - app_storage:/var/www/storage
        - app_bootstrap_cache:/var/www/bootstrap/cache
    networks:
        - mapping-solutions

services:
    setup:
        <<: *app
        restart: "no"
        command:
            - sh
            - -ec
            - |
                composer install --no-interaction --prefer-dist
                npm ci --ignore-scripts
                php artisan optimize:clear
                php artisan storage:link --force --no-interaction
                php artisan migrate --force --no-interaction
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    app:
        <<: *app
        restart: unless-stopped
        command: php artisan octane:frankenphp --host=0.0.0.0 --port=80 --watch --poll
        ports:
            - "${APP_PORT:-8000}:80"
        depends_on:
            setup:
                condition: service_completed_successfully
            mailpit:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost/up"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    queue:
        <<: *app
        restart: unless-stopped
        command: php artisan queue:listen --sleep=1 --tries=3 --timeout=90 --no-interaction
        stop_grace_period: 2m
        depends_on:
            setup:
                condition: service_completed_successfully

    scheduler:
        <<: *app
        restart: unless-stopped
        command: php artisan schedule:work --no-interaction
        depends_on:
            setup:
                condition: service_completed_successfully

    vite:
        <<: *app
        restart: unless-stopped
        command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
        environment:
            <<: *app-environment
            CHOKIDAR_USEPOLLING: "true"
        ports:
            - "${VITE_PORT:-5173}:5173"
        depends_on:
            setup:
                condition: service_completed_successfully

    db:
        image: mariadb:11
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - "${DB_FORWARD_PORT:-3307}:3306"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - mapping-solutions
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "${REDIS_FORWARD_PORT:-6380}:6379"
        volumes:
            - redis_data:/data
        networks:
            - mapping-solutions
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    mailpit:
        image: axllent/mailpit:v1.31.5
        restart: unless-stopped
        environment:
            MP_DATABASE: /data/mailpit.db
            MP_MAX_MESSAGES: 5000
        ports:
            - "${MAILPIT_SMTP_PORT:-1025}:1025"
            - "${MAILPIT_UI_PORT:-8025}:8025"
        volumes:
            - mailpit_data:/data
        networks:
            - mapping-solutions

networks:
    mapping-solutions:
        driver: bridge

volumes:
    db_data:
    redis_data:
    mailpit_data:
    vendor_data:
    node_modules:
    app_storage:
    app_bootstrap_cache:
