# Development Docker Compose stack

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: mapping-solutions-app
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - app_storage:/var/www/storage
            - app_bootstrap_cache:/var/www/bootstrap/cache
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - mapping-solutions
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:80/up"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        ports:
            - "8000:80"
    queue:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: mapping-solutions-queue
        restart: unless-stopped
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        env_file:
            - .env
        volumes:
            - app_storage:/var/www/storage
            - app_bootstrap_cache:/var/www/bootstrap/cache
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - mapping-solutions

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: mapping-solutions-scheduler
        restart: unless-stopped
        command: >
            sh -c '
              while true; do
                php artisan schedule:run --no-interaction
                sleep 60
              done
            '
        env_file:
            - .env
        volumes:
            - app_storage:/var/www/storage
            - app_bootstrap_cache:/var/www/bootstrap/cache
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - mapping-solutions

    db:
        image: mariadb:11
        container_name: mapping-solutions-db
        restart: unless-stopped
        expose:
            - "3306"
        env_file:
            - .env
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - mapping-solutions
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    redis:
        image: redis:7-alpine
        container_name: mapping-solutions-redis
        restart: unless-stopped
        expose:
            - "6379"
        networks:
            - mapping-solutions
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3

networks:
    mapping-solutions:
        driver: bridge

volumes:
    db_data:
    app_storage:
    app_bootstrap_cache:
